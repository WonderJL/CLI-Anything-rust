# cargo-deny configuration — supply-chain enforcement for CLI-Anything-rust.
# Schema v2 (cargo-deny >= 0.14). Run: `cargo deny check`.

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Permissive licenses only; the dependency tree is kept minimal and audited.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    # Mozilla CA certificate bundle (webpki-roots), pulled in by ureq's TLS.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
# Surface accidental dependency bloat / duplicate versions without failing the build yet.
multiple-versions = "warn"
wildcards = "deny"
# Local path deps (e.g. cli-anything-core) legitimately omit a version until published.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
