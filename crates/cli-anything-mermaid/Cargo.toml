[package]
name = "cli-anything-mermaid"
description = "Agent-native CLI for Mermaid diagrams: author, render (mmdc/HTTP), and verify diagrams."
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
publish = false

[[bin]]
name = "cli-anything-mermaid"
path = "src/main.rs"

[dependencies]
cli-anything-core = { path = "../cli-anything-core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
flate2 = "1"
base64 = "0.22"