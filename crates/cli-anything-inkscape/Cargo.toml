[package]
name = "cli-anything-inkscape"
description = "Agent-native CLI for Inkscape: build SVG documents, export via real inkscape, safely import untrusted SVG."
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
publish = false

[[bin]]
name = "cli-anything-inkscape"
path = "src/main.rs"

[dependencies]
cli-anything-core = { path = "../cli-anything-core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.40"